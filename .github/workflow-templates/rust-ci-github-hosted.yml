# Starter workflow – GitHub-hosted runners
#
# Template variables (replace before committing):
#   {{ actions_org }}   – GitHub org or user that hosts the rust-ci actions
#                         (e.g. bitcoincore-dev when using the upstream repo)
#   {{ actions_repo }}  – name of that repository (e.g. rust-ci-template)
#   {{ actions_ref }}   – ref to pin the actions to (e.g. main or a SHA)
#
# GitHub's built-in template variable:
#   $default-branch     – replaced with the default branch name when a user
#                         creates a workflow from this starter template

name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install the pinned Rust toolchain (reads rust-toolchain.toml when present).
      - uses: {{ actions_org }}/{{ actions_repo }}/install-rust-toolchain@{{ actions_ref }}
        with:
          toolchain-file: rust-toolchain.toml   # remove if no toolchain file in repo
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

  crates-io:
    name: crates.io build (no patch overrides)
    runs-on: ubuntu-latest
    # Only run on pushes/PRs that change Rust source or manifests.
    if: >-
      contains(github.event.head_commit.modified, '.rs') ||
      contains(github.event.head_commit.modified, 'Cargo')

    steps:
      - uses: actions/checkout@v4

      # Strip [patch.crates-io] so CI resolves deps from the registry.
      - uses: {{ actions_org }}/{{ actions_repo }}/strip-patch-crates-io@{{ actions_ref }}

      - uses: {{ actions_org }}/{{ actions_repo }}/install-rust-toolchain@{{ actions_ref }}
        with:
          toolchain-file: rust-toolchain.toml

      - name: build (crates.io deps)
        run: cargo build --all-features
